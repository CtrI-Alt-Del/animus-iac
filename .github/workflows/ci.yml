name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  python-validate:
    name: Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Validate Python sources compile
        run: uv run python -m compileall src

  pulumi-preview:
    name: Pulumi Preview (stg)
    needs:
      - python-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: stg
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Pulumi login
        run: |
          if [ -n "${PULUMI_BACKEND_URL}" ]; then
            pulumi login "${PULUMI_BACKEND_URL}"
          else
            pulumi login
          fi
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}

      - name: Pulumi preview (stg)
        run: |
          pulumi stack select stg --non-interactive
          pulumi preview --non-interactive --diff

  pulumi-up-stg:
    name: Pulumi Up (stg)
    needs:
      - python-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: stg
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Pulumi login
        run: |
          if [ -n "${PULUMI_BACKEND_URL}" ]; then
            pulumi login "${PULUMI_BACKEND_URL}"
          else
            pulumi login
          fi
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}

      - name: Pulumi up (stg)
        run: |
          pulumi stack select stg --non-interactive
          pulumi up --yes --non-interactive
