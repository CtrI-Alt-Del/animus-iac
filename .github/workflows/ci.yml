name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  python-validate:
    name: Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Validate Python sources compile
        run: uv run python -m compileall src
